<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Gityus13. Clean engineering. Practical solutions." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/><stop offset="1" stop-color="#b4b4b4"/>
    </linearGradient>
    <linearGradient id="sheen">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="headline">
      <text x="44" y="116"
      font-family="Arial, Helvetica, sans-serif"
      font-size="42"
      font-weight="700"
      fill="url(#face)">Clean engineering. Practical solutions.</text>
    </clipPath>
  </defs>

  <rect width="1000" height="240" fill="#080808"/>
  <rect x=".5" y=".5" width="999" height="239" fill="none" stroke="#1a1a1a"/>

  <text x="44" y="42" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="6" fill="#9a9a9a">GITYUS13</text>
  <text x="956" y="42" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="5" fill="#4d4d4d">BAKU, AZERBAIJAN</text>

  <text x="44" y="116" textLength="684" lengthAdjust="spacing" font-family="Arial, Helvetica, sans-serif" font-size="42" letter-spacing="-.6" fill="url(#face)">Clean engineering. Practical solutions.</text>
  <g clip-path="url(#headline)">
    <rect x="-200" y="78" width="130" height="56" fill="url(#sheen)" transform="skewX(-20)">
      <animate attributeName="x" values="-200;1100;1100" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>

  <line x1="44" y1="156" x2="956" y2="156" stroke="#232323"/>
  <line x1="44" y1="156" x2="124" y2="156" stroke="#8a8a8a" opacity=".8">
    <animate attributeName="x1" values="44;876;44" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="124;956;124" dur="12s" repeatCount="indefinite"/>
  </line>

  <text x="44" y="200" textLength="184.0" lengthAdjust="spacing" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="4" fill="#4d4d4d">WEB APPLICATIONS
    <animate attributeName="fill" values="#4d4d4d;#e2e2e2;#e2e2e2;#4d4d4d;#4d4d4d" keyTimes="0;.05;.30;.36;1" dur="9s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text x="254.0" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#2c2c2c">/</text>
  <text x="280.0" y="200" textLength="161.0" lengthAdjust="spacing" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="4" fill="#4d4d4d">SOFTWARE TOOLS
    <animate attributeName="fill" values="#4d4d4d;#e2e2e2;#e2e2e2;#4d4d4d;#4d4d4d" keyTimes="0;.05;.30;.36;1" dur="9s" begin="3s" repeatCount="indefinite"/>
  </text>
  <text x="467.0" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#2c2c2c">/</text>
  <text x="493.0" y="200" textLength="195.5" lengthAdjust="spacing" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="4" fill="#4d4d4d">HARDWARE PROJECTS
    <animate attributeName="fill" values="#4d4d4d;#e2e2e2;#e2e2e2;#4d4d4d;#4d4d4d" keyTimes="0;.05;.30;.36;1" dur="9s" begin="6s" repeatCount="indefinite"/>
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
